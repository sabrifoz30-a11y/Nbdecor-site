async function prepClick(a,b){var o=S.open?S.orders.find(function(x){return x.id===S.open}):null;
  if(a==="ptab"){S.ptab=b.dataset.v;render();return true}
  if(a==="popen"){S.open=+b.dataset.id;S.ppart=null;render();scrollTo(0,0);return true}
  if(a==="pback"){S.open=null;S.ppart=null;S.zoom=null;render();return true}
  if(a==="pzoom"){S.zoom=b.dataset.v;render();return true}

  if(a==="pset"){var i=+b.dataset.i,v=b.dataset.v,pp=Object.assign({},o.prep||{});if(!v)delete pp[i];else pp[i]={st:v,got:v==="ok"?(+o.items[i].qty||0):0};S.ppart=null;if(await prepSave(o,{prep:pp}))render();return true}
  if(a==="ppart"){S.ppart=+b.dataset.i;render();return true}
  if(a==="ppx"){S.ppart=null;render();return true}
  if(a==="ppinc"||a==="ppdec"){var n=document.getElementById("ppn"),m=+b.dataset.max||+n.max;n.value=Math.max(0,Math.min(+n.max,(+n.value||0)+(a==="ppinc"?1:-1)));return true}

  if(a==="pready"){if(await prepSave(o,{status:"ready",prepared_at:new Date().toISOString(),prepared_by:S.user.id,history:hist(o,"ready")},"✅ الطلبية #"+o.id+" جاهزة")){S.open=null;render()}return true}

  return false}
