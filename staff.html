function shrink(file,mx){return new Promise(function(res){var url=URL.createObjectURL(file),im=new Image();im.onload=function(){var m=mx||1200,k=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){res(b||file)},"image/jpeg",0.84)};im.onerror=function(){URL.revokeObjectURL(url);res(file)};im.src=url})}

function finalize(d){var o=JSON.parse(JSON.stringify(d)),t=vtOf(o),ops=t==="model"?modelOpts(o):o._o.map(function(x){return String(x).trim()}).filter(Boolean);
  if(t==="color")o.colors=ops.join("، ");else if(t!=="model")o.vopts=ops.join("، ");
  var vp={};ops.forEach(function(k){if(+o.vprices[k]>0)vp[k]=+o.vprices[k]});if(Object.keys(vp).length)o.vprices=vp;else delete o.vprices;
  o.xv=o.xv.map(function(x){var l=x.l.map(function(s){return String(s).trim()}).filter(Boolean),pr={};l.forEach(function(k){if(+x.pr[k]>0)pr[k]=+x.pr[k]});var r={t:x.t,l:l};if(x.t==="custom"&&x.n)r.n=x.n;if(Object.keys(pr).length)r.pr=pr;return r}).filter(function(x){return x.l.length});if(!o.xv.length)delete o.xv;
  if(t==="color")delete o.vt;o.ref=String(o.ref||"").trim().toUpperCase();o.price=+o.price||0;o.stems=+o.stems||0;o.img=o.imgs.length?o.imgs[0].u:"";delete o._o;if(!o.novar)delete o.novar;return o}

async function carrierGet(cid,path,q,hop){var r=await sb.rpc("carrier_call",{cid:cid,path:path,q:q||{}});if(r.error)throw new Error(r.error.message);var rid=r.data,res={done:false,timed_out:true};
  for(var i=0;i<25;i++){await new Promise(function(z){setTimeout(z,800)});var x=await sb.rpc("carrier_result",{rid:rid});if(x.data&&x.data.done){res=x.data;break}}
  if(!hop&&res.done&&res.status>=300&&res.status<400&&res.location){var nb=normBase(res.location),sh=shipData(),c=sh.companies.find(function(z){return z.id===cid});if(nb&&c&&nb!==c.base){c.base=nb;await saveShip();return carrierGet(cid,path,q,1)}}
  return res}

function explain(res){if(!res||!res.done)return{ok:false,msg:"لم تردّ الشركة في الوقت. أعد المحاولة بعد قليل."};
  if(res.status===200)return{ok:true,msg:"✅ الاتصال ناجح، الشركة قبلت الـ Token."};
  if(res.status===401||res.status===403)return{ok:false,msg:"❌ الشركة رفضت بيانات الربط ("+res.status+"). تأكد أنك نسخت الرموز كاملة من لوحتك عند الناقل."};
  if(res.status>=300&&res.status<400)return{ok:false,msg:"❌ رابط المنصة تغيّر ("+res.status+"). افتح لوحتك عند الشركة وانسخ الرابط الجديد من شريط العنوان."};
  if(res.status===404)return{ok:false,msg:"❌ هذا الرابط لا يبدو منصة الشركة. تأكد من الرابط."};
  return{ok:false,msg:"❌ خطأ من الشركة ("+(res.status||res.error||"؟")+")."}}
function testPath(id){var c=shipData().companies.find(function(z){return z.id===id});return c&&c.platform==="yalidine"?"/v1/wilayas/":"/api/v1/get/wilayas"}
async function saveShip(){var keep=shipData();var e=await saveSettingsPatch({shipping:keep});if(e)toast("تعذّر الحفظ: "+e.message);return !e}
async function shippingClick(a,b){var sh=shipData();
  if(a==="connnew"){S.conn={platform:"dhd",base:PLAT.dhd.base,ramassage:false};S.tryRes=null;render()}
  else if(a==="connedit"){var c=sh.companies.find(function(x){return x.id===b.dataset.id});S.conn=JSON.parse(JSON.stringify(c));S.tryRes=null;render()}
  else if(a==="connback"){S.conn=null;S.tryRes=null;render()}
  else if(a==="plat"){S.conn.platform=b.dataset.v;S.conn.base=b.dataset.v==="dhd"?PLAT.dhd.base:"";if(b.dataset.v==="yalidine"&&!S.conn.sub)S.conn.sub="yalidine";S.tryRes=null;render()}
  else if(a==="pweye"){var t=document.getElementById("c-tok");t.type=t.type==="password"?"text":"password"}
  else if(a==="conntry"||a==="connsave"){var c2=S.conn,base=normBase(document.getElementById("c-base").value),tok=document.getElementById("c-tok").value.trim();
    var pl2=platOf(c2),aid=pl2==="yalidine"?document.getElementById("c-aid").value.trim():"";if(pl2==="yalidine")c2.sub=document.getElementById("c-sub").value;
    if(!base){S.tryRes={ok:false,msg:pl2==="yalidine"?"اكتب رابط الواجهة (API) للشركة.":"اكتب رابط المنصة، مثلاً dhd.ecotrack.dz"};render();return}
    var isNew=!c2.id;c2.base=base;c2.ramassage=document.getElementById("c-ram").checked;c2.nick=document.getElementById("c-nick").value.trim();
    if(isNew&&!tok){S.tryRes={ok:false,msg:"الصق الـ Token أولاً."};render();return}
    if(isNew&&pl2==="yalidine"&&!aid){S.tryRes={ok:false,msg:"الصق الـ API ID أولاً."};render();return}
    c2.platform=pl2;if(!c2.name)c2.name=pl2==="yalidine"?YAL[c2.sub].name:pl2==="dhd"?"DHD":hostName(base).split(".")[0].toUpperCase();
    if(S.conn.platform==="dhd"&&!c2.name)c2.name="DHD";if(isNew){var slug=pl2==="yalidine"?c2.sub:pl2==="dhd"?"dhd":hostName(base).split(".")[0].replace(/[^a-z0-9]/g,"").slice(0,30)||"carrier";c2.id=slug;var n=2;while(sh.companies.some(function(x){return x.id===c2.id}))c2.id=slug+(n++)}
    if(tok){var r1=await sb.rpc("set_secret",{k:"carrier:"+c2.id,v:tok});if(r1.error){S.tryRes={ok:false,msg:"تعذّر حفظ الـ Token: "+r1.error.message};if(isNew)c2.id=null;render();return}}
    if(aid){var r3=await sb.rpc("set_secret",{k:"carrier:"+c2.id+"-apiid",v:aid});if(r3.error){S.tryRes={ok:false,msg:"تعذّر حفظ الـ API ID: "+r3.error.message};if(isNew)c2.id=null;render();return}}
    var i=sh.companies.findIndex(function(x){return x.id===c2.id});var keep=JSON.parse(JSON.stringify(c2));if(i>-1)sh.companies[i]=keep;else sh.companies.push(keep);if(!sh.def)sh.def=c2.id;
    if(!await saveShip())return;await loadSecrets();
    if(a==="conntry"){S.trying=true;render();try{var res=await carrierGet(c2.id,testPath(c2.id));var cc=sh.companies.find(function(z){return z.id===c2.id});if(cc)c2.base=cc.base;S.tryRes=explain(res)}catch(err){S.tryRes={ok:false,msg:"❌ "+err.message}}S.trying=false;render()}
    else{S.conn=null;S.tryRes=null;render();toast("رُبطت "+(c2.nick||c2.name))}}
  else if(a==="conntest"){S.testRes={id:b.dataset.id,ok:true,msg:"جارٍ الاتصال…"};render();try{S.testRes=Object.assign({id:b.dataset.id},explain(await carrierGet(b.dataset.id,testPath(b.dataset.id))))}catch(err){S.testRes={id:b.dataset.id,ok:false,msg:"❌ "+err.message}}render()}
  else if(a==="shipdef"){sh.def=b.dataset.id;if(await saveShip()){render();toast("أصبحت الشركة الافتراضية")}}
  else if(a==="conndel"){var id=b.dataset.id;if(S.delShip!==id){S.delShip=id;render();return}S.delShip=null;await sb.rpc("set_secret",{k:"carrier:"+id,v:""});await sb.rpc("set_secret",{k:"carrier:"+id+"-apiid",v:""});sh.companies=sh.companies.filter(function(x){return x.id!==id});if(sh.def===id)sh.def=sh.companies[0]?sh.companies[0].id:null;await saveShip();await loadSecrets();render();toast("فُصلت الشركة وحُذف الـ Token")}
  else return false;return true}

async function bordUrl(o){if(!o||!o.bordereau)return;S.bordUrl=S.bordUrl||{};if(S.bordUrl[o.id])return;var r=await sb.storage.from("proofs").createSignedUrl(o.bordereau,3600);if(r.data&&r.data.signedUrl){S.bordUrl[o.id]=r.data.signedUrl;render()}}

async function driverClick(a,b){
  if(a==="dtab"){S.dtab=b.dataset.v;render();return true}
  if(a==="track"){try{await navigator.clipboard.writeText(b.dataset.v);toast("نُسخ الرقم، الصقه في صفحة التتبع")}catch(e){}window.open(TRACK_URL,"_blank","noopener");return true}
  if(a==="copy"){try{await navigator.clipboard.writeText(b.dataset.v);toast("نُسخ")}catch(e){toast("تعذّر النسخ")}return true}
  if(a==="bordre"){S.bord=null;render();var i=document.getElementById("bord-in");if(i)i.click();return true}
  if(a==="shipdone"){var id=+b.dataset.id,o=S.orders.find(function(x){return x.id===id});if(!S.bord||S.bord.id!==id||S.sending)return true;
    S.bordTrk=(document.getElementById("bord-trk")||{}).value||"";S.sending=true;render();
    try{var path="bordereau/"+id+"-"+Date.now()+".jpg";var up=await sb.storage.from("proofs").upload(path,S.bord.blob,{contentType:"image/jpeg",upsert:false});if(up.error)throw up.error;
      var r=await sb.rpc("driver_ship",{oid:id,photo:path,trk:S.bordTrk.trim()||null});if(r.error)throw r.error;Object.assign(o,r.data);
      S.bordUrl=S.bordUrl||{};S.bordUrl[id]=S.bord.url;S.bord=null;S.bordTrk="";S.sending=false;S.open=null;render();toast("✅ أُرسل الطرد #"+id)}
    catch(err){S.sending=false;render();toast(/not ready/.test(err.message)?"هذه الطلبية لم تعد جاهزة للإرسال":"تعذّر الإرسال: "+err.message)}return true}
  return false}
async function bordPick(file){var id=S.open;var blob=await shrink(file,1800);S.bordTrk=(document.getElementById("bord-trk")||{}).value||S.bordTrk||"";S.bord={id:id,blob:blob,url:URL.createObjectURL(blob)};render()}
function render(){var body;if(!S.user)body=loginView();else if(!S.me||S.me.role==="pending")body=pendingView();else if(S.me.role==="driver"){body=S.open?driverOrderView():driverView()}else if(!isOwner()&&S.view!=="orders"){S.view="orders";body=S.open?orderView():ordersView()}else if(S.view==="home")body=homeView();else if(S.view==="users")body=staffView();else if(S.view==="products")body=productsView();else if(S.view==="funnels")body=funnelsView();else if(S.view==="shipping")body=shippingView();else if(SOON[S.view])body=soonView(S.view);else if(S.open)body=orderView();else body=ordersView();app.innerHTML=top()+body}
async function loadMe(){var r=await sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();S.me=r.data}
async function loadOrders(){var r=await sb.from("orders").select("*").order("id",{ascending:false}).limit(500);if(!r.error)S.orders=r.data||[]}
async function loadStaff(){var r=await sb.from("profiles").select("*").order("created_at");if(!r.error)S.staff=r.data||[]}
async function boot(){var s=await sb.auth.getSession();S.user=s.data.session?s.data.session.user:null;if(S.user){await loadMe();if(S.me&&S.me.role!=="pending"){if(S.me.role==="preparer")S.tab="confirmed";if(!isOwner())S.view="orders";await loadOrders();if(S.me.role==="owner")await loadStaff()}}render()}

  else if(a==="tttoksave"){var t3=document.getElementById("tttok").value.trim(),c3=document.getElementById("tttest").value.trim();
