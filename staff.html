<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة العمل · ورد الجملة</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#F8F5F4;--surface:#FFFFFF;--sunk:#F1ECEB;--fg:#1E2B25;--muted:#65706A;--line:#E4DCDB;--leaf:#2E6A4E;--leaf-ink:#fff;--petal:#B83E62;--petal-soft:#F6E1E8;--warn:#A5531B;--warn-soft:#F8E7DA;--ok-soft:#E1EFE7;
--display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--surface:#1A221E;--sunk:#151C18;--fg:#ECEFEB;--muted:#A1ABA4;--line:#2C3631;--leaf:#73C197;--leaf-ink:#0E1512;--petal:#EC86A4;--petal-soft:#3A222B;--warn:#F0A46B;--warn-soft:#3A2A1E;--ok-soft:#1E3127;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--leaf)}
.who{font-size:12px;color:var(--muted)}
h1,h2{font-family:var(--display);margin:0;line-height:1.3}h1{font-size:24px;color:var(--leaf)}h2{font-size:18px}
.page{padding-block:18px 80px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
label.f{display:grid;gap:4px;font-size:13.5px;font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-main{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}.btn-sm{padding:5px 10px;font-size:13px}
.x{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:500;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.tab b{font-size:12px;opacity:.75;margin-inline-start:4px}
.olist{display:grid;gap:10px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;text-align:start;width:100%}
.oc .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.no{font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}.amt{font-weight:700;color:var(--petal)}
.meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;font-weight:600;background:var(--sunk)}
.pill.new{background:var(--petal-soft);color:var(--petal)}.pill.confirmed,.pill.ready,.pill.delivered{background:var(--ok-soft);color:var(--leaf)}.pill.missing,.pill.returned,.pill.cancelled{background:var(--warn-soft);color:var(--warn)}
.items{display:grid;gap:8px}.it{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}
.it img{width:64px;height:80px;object-fit:contain;background:var(--sunk);border-radius:8px}.it small{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--muted);font-weight:500}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.note{background:var(--petal-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.err{color:var(--warn);font-size:13.5px}
.staff{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-block:8px}.staff:last-child{border:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;z-index:20;font-size:14px}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.menu-btn{border:0;background:none;padding:6px;color:var(--fg);display:grid;place-items:center;border-radius:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(290px,84vw);background:var(--surface);border-left:1px solid var(--line);z-index:10;transform:translateX(105%);transition:transform .22s ease;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer-h{font-family:var(--display);font-size:20px;font-weight:700;color:var(--leaf);padding:4px 10px 10px}
.nav-i{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:10px;font-weight:500;color:var(--fg);text-decoration:none;text-align:start;width:100%}
.nav-i[aria-current="page"]{background:var(--ok-soft);color:var(--leaf)}
.nav-i .badge{margin-inline-start:auto;background:var(--petal);color:#fff;border-radius:999px;font-size:12px;min-width:22px;padding:0 6px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.stat span{font-size:13px;color:var(--muted)}.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px;display:grid;justify-items:center;gap:6px;font-weight:600;color:var(--leaf)}
.tile span{color:var(--fg)}.tile small{font-size:11px;color:var(--muted);font-weight:500}
.soon{justify-items:center;text-align:center;padding:30px 16px;color:var(--leaf)}.soon b{color:var(--fg);font-size:17px}

</style></head><body>

<script>
(function(){

var S={menu:false,user:null,me:null,view:"home",tab:"new",orders:[],staff:[],open:null,mode:"login",err:"",busy:false};
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

var IC={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',orders:'<path d="M6 3h12l1 4H5zM5 7h14v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM9 11h6M9 15h6"/>',products:'<path d="M12 3c2 2 2 5 0 7-2-2-2-5 0-7zM12 10v11M12 14c-3 0-5-2-5-4 3 0 5 2 5 4zM12 17c3 0 5-2 5-4-3 0-5 2-5 4z"/>',funnels:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>',users:'<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M19 15c2 1 3 3 3 6"/>',shipping:'<path d="M2 6h11v10H2zM13 9h5l3 3v4h-8zM6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>',tools:'<path d="M14 7a4 4 0 0 0 5 5l-8 8a2 2 0 0 1-3-3l8-8a4 4 0 0 0-2-2zM4 4l4 4"/>',settings:'<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-1-3-2 .5-1.5-1.5L17 5l-3-1-1 2h-2l-1-2-3 1 .5 2L6 8.5 4 8l-1 3 2 1v0l-2 1 1 3 2-.5L7.5 17 7 19l3 1 1-2h2l1 2 3-1-.5-2 1.5-1.5 2 .5 1-3z"/>'};
var NAV=[["home","الرئيسية"],["orders","الطلبات"],["products","المنتجات"],["funnels","مسارات البيع"],["users","المستخدمين"],["shipping","شركات الشحن"],["tools","أدوات النظام"],["settings","الإعدادات"]];
function ico(k){return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[k]||"")+'</svg>'}
function isOwner(){return S.me&&S.me.role==="owner"}
function navItems(){return isOwner()?NAV:[["orders","الطلبات"]]}
function top(){return '<header class="top"><div class="wrap">'+(S.user&&isOwner()?'<button class="menu-btn" data-act="menu" aria-label="القائمة"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>':'')+'<div style="flex:1;min-width:0"><div class="brand">ورد الجملة</div>'+(S.me?'<div class="who">'+esc(S.me.name)+' · '+ROLE[S.me.role]+'</div>':'')+'</div>'+(S.user?'<button class="btn btn-sm" data-act="logout">خروج</button>':'<a class="btn btn-sm" href="./">المتجر</a>')+'</div></header>'+
  (S.user&&isOwner()?'<div class="scrim" data-act="menu"'+(S.menu?'':' hidden')+'></div><nav class="drawer'+(S.menu?' open':'')+'" aria-label="لوحة التحكم"><div class="drawer-h">لوحة التحكم</div>'+NAV.map(function(n){return '<button class="nav-i" data-act="view" data-v="'+n[0]+'" aria-current="'+(S.view===n[0]?'page':'false')+'">'+ico(n[0])+'<span>'+n[1]+'</span>'+(n[0]==="orders"&&counts()["new"]?'<b class="badge">'+counts()["new"]+'</b>':'')+'</button>'}).join("")+'<a class="nav-i" href="./" target="_blank" rel="noopener">'+ico("home")+'<span>فتح المتجر</span></a></nav>':'')}
function loginView(){var su=S.mode==="signup";return '<main class="wrap page"><h1>'+(su?"حساب جديد":"تسجيل الدخول")+'</h1><form class="panel" id="auth">'+
  (su?'<label class="f">الاسم<input id="a-name" required autocomplete="name"></label><label class="f">رقم الهاتف<input id="a-phone" type="tel" dir="ltr" autocomplete="tel"></label>':'')+
  '<label class="f">البريد الإلكتروني<input id="a-email" type="email" dir="ltr" required autocomplete="email"></label><label class="f">كلمة السر<input id="a-pass" type="password" dir="ltr" required minlength="6" autocomplete="'+(su?"new-password":"current-password")+'"></label>'+
  (S.err?'<div class="err">'+esc(S.err)+'</div>':'')+'<button class="btn btn-main" '+(S.busy?"disabled":"")+'>'+(su?"إنشاء الحساب":"دخول")+'</button>'+
  '<button type="button" class="x" data-act="mode">'+(su?"عندي حساب، أريد الدخول":"عامل جديد؟ أنشئ حساباً")+'</button></form></main>'}
function pendingView(){return '<main class="wrap page"><div class="panel"><h2>مرحباً '+esc(S.me&&S.me.name)+' 👋</h2><p style="margin:0">حسابك أُنشئ، وهو <b>في انتظار موافقة صاحب المحل</b>. عندما يحدد دورك (مؤكد أو مجهّز) ستظهر لك الطلبيات هنا.</p><button class="btn" data-act="reload">تحديث</button></div></main>'}
function counts(){var c={};S.orders.forEach(function(o){c[o.status]=(c[o.status]||0)+1});return c}
function ordersView(){
  var c=counts(),tabs=S.me.role==="preparer"?["confirmed","preparing","missing","ready"]:["new","confirming","confirmed","preparing","missing","ready","shipped","delivered","returned","cancelled"];
  var list=S.orders.filter(function(o){return o.status===S.tab});
  return '<main class="wrap page"><div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab" data-act="tab" data-v="'+t+'" aria-pressed="'+(S.tab===t)+'">'+ST[t]+(c[t]?'<b>'+c[t]+'</b>':'')+'</button>'}).join("")+'</div>'+
  '<div class="olist">'+(list.length?list.map(function(o){var cu=o.customer||{};return '<button class="oc" data-act="open" data-id="'+o.id+'"><div class="row1"><span class="no">#'+o.id+'</span><span class="amt">'+fmt(o.total)+'</span></div><div>'+esc(cu.name)+' · <span class="meta">'+esc(cu.wilaya)+'</span></div><div class="meta">'+(o.items||[]).length+' منتج · '+when(o.created_at)+'</div></button>'}).join(""):'<div class="empty">لا توجد طلبيات '+ST[S.tab]+' الآن.</div>')+'</div></main>'}
function orderView(){var o=S.orders.find(function(x){return x.id===S.open});if(!o)return ordersView();var cu=o.customer||{},prep=S.me.role==="preparer";
  return '<main class="wrap page"><button class="x" data-act="back">← رجوع إلى الطلبيات</button><div class="panel"><div class="row1" style="display:flex;justify-content:space-between;align-items:center"><h1 class="no">#'+o.id+'</h1><span class="pill '+o.status+'">'+ST[o.status]+'</span></div>'+
  '<div class="kv"><b>الزبون</b><span>'+esc(cu.name)+'</span>'+(prep?'':'<b>الهاتف</b><span dir="ltr" style="text-align:right">'+esc(cu.phone)+'</span>')+'<b>الولاية</b><span>'+esc(cu.wilaya)+'</span>'+(prep?'':'<b>العنوان</b><span>'+esc(cu.address)+'</span>')+'<b>التوصيل</b><span>'+(cu.delivery==="مكتب"?"مكتب التوصيل":"المنزل")+'</span>'+(cu.notes?'<b>ملاحظات</b><span>'+esc(cu.notes)+'</span>':'')+'<b>التاريخ</b><span>'+when(o.created_at)+'</span></div>'+
  (prep?'':'<div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-sm" href="tel:'+esc(cu.phone)+'">📞 اتصال</a><a class="btn btn-sm" target="_blank" rel="noopener" href="https://wa.me/'+waNum(cu.phone)+'">💬 واتساب</a></div>')+'</div>'+
  '<div class="panel"><h2>المنتجات ('+(o.items||[]).length+')</h2><div class="items">'+(o.items||[]).map(function(it){return '<div class="it"><img loading="lazy" src="'+esc(it.img)+'" alt=""><div><b dir="ltr">'+esc(it.ref)+'</b><br><small>'+esc((it.variant||[]).join(" · "))+'</small></div><div style="text-align:left"><b>× '+it.qty+'</b><br><small>'+fmt(it.price*it.qty)+'</small></div></div>'}).join("")+'</div>'+
  (prep?'':'<div style="display:flex;justify-content:space-between;font-weight:700;font-size:18px"><span>المجموع</span><span class="amt">'+fmt(o.total)+'</span></div>')+'</div>'+
  '<div class="panel"><h2>تغيير الحالة</h2><label class="f">الحالة الجديدة<select id="st-sel">'+Object.keys(ST).filter(function(k){return !prep||["preparing","missing","ready"].indexOf(k)>-1}).map(function(k){return '<option value="'+k+'"'+(k===o.status?" selected":"")+'>'+ST[k]+'</option>'}).join("")+'</select></label><button class="btn btn-main" data-act="setst" data-id="'+o.id+'">حفظ الحالة</button><span class="meta">المراحل المفصّلة (لقطة الشاشة، صورة الملخص، التقسيم، قائمة التجهيز) قادمة في المرحلتين 2 و3.</span></div></main>'}
function waNum(p){var d=String(p||"").replace(/\D/g,"");if(d.charAt(0)==="0")d="213"+d.slice(1);return d}
function homeView(){var c=counts(),today=S.orders.filter(function(o){return new Date(o.created_at).toDateString()===new Date().toDateString()});
  return '<main class="wrap page"><h1>لوحة التحكم</h1><div class="stats"><div class="stat"><span>طلبات اليوم</span><b>'+today.length+'</b></div><div class="stat"><span>جديدة تنتظر</span><b>'+(c["new"]||0)+'</b></div><div class="stat"><span>مؤكدة</span><b>'+(c.confirmed||0)+'</b></div><div class="stat"><span>مبيعات اليوم</span><b>'+fmt(today.reduce(function(s,o){return s+(+o.total||0)},0))+'</b></div></div>'+
  '<div class="tiles">'+NAV.slice(1).map(function(n){return '<button class="tile" data-act="view" data-v="'+n[0]+'">'+ico(n[0])+'<span>'+n[1]+'</span>'+(SOON[n[0]]?'<small>قريباً</small>':'')+'</button>'}).join("")+'</div></main>'}
var SOON={products:"إضافة المنتجات وتعديلها، الصور، المتغيرات، التصنيفات، وقراءة الأسعار بالذكاء الاصطناعي.",funnels:"صفحات بيع خاصة لمنتج أو عرض معيّن، وروابط لكل قناة (تلغرام، فيسبوك، إنستغرام) لتعرف من أين يأتي الزبائن.",shipping:"شركات التوصيل، أسعار التوصيل لكل ولاية (منزل ومكتب)، وأرقام التتبع.",tools:"تقسيم الطلبيات، صورة ملخص الطلبية، القائمة السوداء للأرقام، والإحصائيات.",settings:"اسم المتجر، رقم الواتساب، رسالة أعلى المتجر، وطريقة كتابة السعر."};
function soonView(k){var n=NAV.find(function(x){return x[0]===k});return '<main class="wrap page"><h1>'+n[1]+'</h1><div class="panel soon">'+ico(k)+'<b>هذا القسم قيد التجهيز</b><p class="muted" style="margin:0">'+SOON[k]+'</p></div></main>'}
function staffView(){return '<main class="wrap page"><h1>المستخدمين</h1><div class="note">يدخل العامل إلى هذه الصفحة وينشئ حساباً، ثم تختار له دوره هنا.</div><div class="panel">'+(S.staff.length?S.staff.map(function(u){return '<div class="staff"><div><b>'+esc(u.name)+'</b><div class="meta" dir="ltr" style="text-align:right">'+esc(u.phone||"")+'</div></div>'+(u.id===S.user.id?'<span class="pill confirmed">'+ROLE[u.role]+'</span>':'<select data-role="'+u.id+'" aria-label="دور '+esc(u.name)+'">'+Object.keys(ROLE).map(function(r){return '<option value="'+r+'"'+(u.role===r?" selected":"")+'>'+ROLE[r]+'</option>'}).join("")+'</select>')+'</div>'}).join(""):'<div class="empty">لا يوجد عمال بعد.</div>')+'</div></main>'}
function render(){var body;if(!S.user)body=loginView();else if(!S.me||S.me.role==="pending")body=pendingView();else if(!isOwner()&&S.view!=="orders"){S.view="orders";body=S.open?orderView():ordersView()}else if(S.view==="home")body=homeView();else if(S.view==="users")body=staffView();else if(SOON[S.view])body=soonView(S.view);else if(S.open)body=orderView();else body=ordersView();app.innerHTML=top()+body}
async function loadMe(){var r=await sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();S.me=r.data}
async function loadOrders(){var r=await sb.from("orders").select("*").order("id",{ascending:false}).limit(500);if(!r.error)S.orders=r.data||[]}
async function loadStaff(){var r=await sb.from("profiles").select("*").order("created_at");if(!r.error)S.staff=r.data||[]}
async function boot(){var s=await sb.auth.getSession();S.user=s.data.session?s.data.session.user:null;if(S.user){await loadMe();if(S.me&&S.me.role!=="pending"){if(S.me.role==="preparer")S.tab="confirmed";if(!isOwner())S.view="orders";await loadOrders();if(S.me.role==="owner")await loadStaff()}}render()}
app.addEventListener("submit",async function(e){if(e.target.id!=="auth")return;e.preventDefault();S.err="";S.busy=true;render();
  var em=document.getElementById("a-email"),pw=document.getElementById("a-pass");
  var vals={email:(document.getElementById("a-email")||{}).value,pass:(document.getElementById("a-pass")||{}).value};
  try{if(S.mode==="signup"){var r=await sb.auth.signUp({email:e.target.querySelector("#a-email").value.trim(),password:e.target.querySelector("#a-pass").value,options:{data:{name:e.target.querySelector("#a-name").value.trim(),phone:e.target.querySelector("#a-phone").value.trim()}}});if(r.error)throw r.error}
    else{var r2=await sb.auth.signInWithPassword({email:e.target.querySelector("#a-email").value.trim(),password:e.target.querySelector("#a-pass").value});if(r2.error)throw r2.error}
    S.busy=false;await boot()}catch(err){S.busy=false;S.err=/Invalid login/i.test(err.message)?"البريد أو كلمة السر غير صحيحة":/registered/i.test(err.message)?"هذا البريد مسجّل من قبل، اختر «عندي حساب»":(/least 6/i.test(err.message)?"كلمة السر يجب أن تكون 6 أحرف على الأقل":err.message);render()}});
app.addEventListener("click",async function(e){var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act;
  if(a==="mode"){S.mode=S.mode==="login"?"signup":"login";S.err="";render()}
  else if(a==="logout"){await sb.auth.signOut();S.user=null;S.me=null;S.open=null;render()}
  else if(a==="reload"){await boot()}
  else if(a==="tab"){S.tab=b.dataset.v;render()}
  else if(a==="view"){S.view=b.dataset.v;S.open=null;S.menu=false;if(S.view==="users")await loadStaff();render();scrollTo(0,0)}
  else if(a==="menu"){S.menu=!S.menu;render()}
  else if(a==="open"){S.open=+b.dataset.id;render();scrollTo(0,0)}
  else if(a==="back"){S.open=null;render()}
  else if(a==="setst"){var id=+b.dataset.id,v=document.getElementById("st-sel").value,o=S.orders.find(function(x){return x.id===id});var h=(o.history||[]).concat([{at:new Date().toISOString(),what:v,by:S.me.name}]);
    var r=await sb.from("orders").update({status:v,history:h,updated_at:new Date().toISOString()}).eq("id",id).select().single();if(r.error){toast("تعذّر الحفظ: "+r.error.message);return}Object.assign(o,r.data);toast("حُفظت الحالة: "+ST[v]);render()}});
app.addEventListener("change",async function(e){var t=e.target;if(t.dataset.role){var r=await sb.from("profiles").update({role:t.value}).eq("id",t.dataset.role);toast(r.error?"تعذّر الحفظ":"حُفظ الدور");await loadStaff()}});
sb.channel("orders").on("postgres_changes",{event:"*",schema:"public",table:"orders"},async function(){if(S.me&&S.me.role!=="pending"){await loadOrders();if(!S.open)render()}}).subscribe();
boot();
})();
</script></body></html>
