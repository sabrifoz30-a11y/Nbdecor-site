/* Layout: sticky shop bar, then a price-sorted photo grid; cart and merchant panel are full views. */
:root{

}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}

.btn-main{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn-petal{background:var(--petal);color:#fff;border-color:var(--petal)}
.btn-wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa);font-weight:600;font-size:16px;padding:13px 18px;justify-content:center}

.note{background:var(--petal-soft);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:16px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-size:14px}

.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:18px;padding-bottom:110px;max-width:560px;margin-inline:auto}

.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;flex:1}
.info{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

  (S.admin?'<button class="btn btn-sm" data-act="go" data-v="'+(S.view==="admin"?"shop":"admin")+'">'+(S.view==="admin"?"عرض المتجر":"لوحة التاجر")+'</button>':'')+
  '<button class="btn" data-act="go" data-v="cart" aria-label="السلة">السلة <span class="count" id="cc">'+cartCount()+'</span></button></div></div></header>';
}
function card(p){
  var sel=S.sel[p.id]||{qty:1,color:""};var cols=options(p);
  return '<article class="card">'+gallery(p,imgIndex(p,sel.color))+'<div class="body">'+
  '<div class="info"><span class="ref">'+esc(p.ref)+'</span><span class="price">'+fmt(p.price)+'</span></div>'+(p.stems>0?'<span class="small muted">عدد الورد: '+p.stems+'</span>':'')+
  (cols.length?'<div class="colors'+(S.need[p.id]?' need':'')+'" role="group" aria-label="'+kindWord(p)+'">'+cols.map(function(c){return '<button class="chip" data-act="color" data-id="'+p.id+'" data-c="'+esc(c)+'" aria-pressed="'+(sel.color===c)+'">'+(isModel(p)?'':'<i style="background:'+hex(c)+'"></i>')+esc(optLabel(p,c))+'</button>'}).join("")+'</div>'+(S.need[p.id]?'<span class="hint">اختر '+kindWord(p)+' أولاً</span>':''):'')+
  '<div class="buy"><div class="step"><button data-act="inc" data-id="'+p.id+'" aria-label="زيادة">+</button><input id="q-'+p.id+'" type="number" inputmode="numeric" min="1" value="'+sel.qty+'" data-qty="'+p.id+'" aria-label="الكمية"><button data-act="dec" data-id="'+p.id+'" aria-label="إنقاص">−</button></div>'+
  '<button class="add" data-act="add" data-id="'+p.id+'">أضف إلى السلة</button></div></div></article>';
}
function gridHtml(){
  var q=S.q.trim().toLowerCase();
  var list=sorted(data.products.filter(function(p){return !q||String(p.ref).toLowerCase().indexOf(q)>-1}));
  if(!data.products.length)return '<div class="empty">لا توجد منتجات بعد.</div>';
  if(!list.length)return '<div class="empty">لا يوجد منتج بهذا المرجع.</div>';
  return list.map(card).join("");
}
function shopView(){
  var n=cartCount();
  return '<main class="wrap">'+(data.shop.note?'<div class="note">'+esc(data.shop.note)+'</div>':'')+
  '<div class="tools"><input id="q" class="search" type="search" placeholder="ابحث بالمرجع…" value="'+esc(S.q)+'" aria-label="بحث بالمرجع">'+
  '<div class="seg" role="group" aria-label="ترتيب حسب السعر"><button data-act="sort" data-v="asc" aria-pressed="'+(S.sort==="asc")+'">الأرخص أولاً</button><button data-act="sort" data-v="desc" aria-pressed="'+(S.sort==="desc")+'">الأغلى أولاً</button></div>'+
  '<span class="muted small" id="pc">'+data.products.length+' منتج</span></div>'+
  '<div class="grid" id="grid">'+gridHtml()+'</div></main>'+
  (n?'<div class="floatbar"><button class="btn btn-petal" data-act="go" data-v="cart">إنهاء الطلب · '+n+' قطعة · '+fmt(cartTotal())+'</button></div>':'');
}
function orderText(){
  var lines=cartLines(),w=form.wilaya?(form.wilaya+" - "+WILAYAS[form.wilaya-1]):"";
  var t="🌸 طلبية جديدة من "+data.shop.name+"\n\nالاسم: "+form.name+"\nالهاتف: "+form.phone+"\nالولاية: "+w+"\nالعنوان: "+form.address+"\nالتوصيل: "+(form.delivery==="مكتب"?"إلى مكتب شركة التوصيل":"إلى المنزل")+"\n";
  if(form.notes)t+="ملاحظات: "+form.notes+"\n";
  t+="\n— المنتجات —\n";
  lines.forEach(function(x,i){t+=(i+1)+") المرجع: "+x.p.ref+" | "+kindWord(x.p)+": "+(x.l.color||"-")+" | الكمية: "+x.l.qty+" | "+fmt(x.p.price)+" × "+x.l.qty+" = "+fmt(x.p.price*x.l.qty)+"\n"});
  t+="\nالمجموع: "+fmt(cartTotal())+" (دون سعر التوصيل)\nالدفع عند الاستلام";
  return t;
}
function waPhone(){var d=String(data.shop.phone||"").replace(/\D/g,"");if(d.indexOf("00")===0)d=d.slice(2);if(d.charAt(0)==="0")d="213"+d.slice(1);return d}
function waHref(){return "https://wa.me/"+waPhone()+"?text="+encodeURIComponent(orderText())}
function formOk(){return form.name.trim()&&form.phone.replace(/\D/g,"").length>=9&&form.wilaya&&form.address.trim()}

  '<label class="th addph" for="add-'+p.id+'"><span>+</span><b>أضف صوراً</b></label><input id="add-'+p.id+'" data-addto="'+p.id+'" type="file" accept="image/*" multiple hidden></div>'+

  '</main>'+
  (S.dirty?'<div class="savebar"><div class="in"><span class="small">'+(S.saving?"جارٍ الحفظ…":"لديك تغييرات غير محفوظة. الزبائن لن يروها قبل الحفظ.")+'</span><button class="btn btn-main" data-act="save"'+(S.saving?" disabled":"")+'>حفظ ونشر</button></div></div>':'');
}
function dupCount(){var seen={},n=0;data.products.forEach(function(p){var k=normRef(p.ref);if(!k)return;if(seen[k])n++;else seen[k]=1});return n}
function mergeDups(){var keep={},out=[],n=0;data.products.forEach(function(p){var k=normRef(p.ref);if(k&&keep[k]){var a=keep[k];(p.imgs||[]).forEach(function(m){a.imgs.push(m)});splitColors(p.colors).forEach(function(c){addColor(a,c)});if(!(a.price>0))a.price=p.price;n++}else{if(k)keep[k]=p;out.push(p)}});data.products=out;return n}
function pastedHtml(){
  var re=/المرجع:\s*([^|\n]+?)\s*\|\s*(?:اللون|الموديل):\s*([^|\n]*?)\s*\|\s*الكمية:\s*(\d+)/g,m,out=[];
  while((m=re.exec(S.pasted))){var r=m[1].trim().toLowerCase();var p=data.products.find(function(x){return String(x.ref).trim().toLowerCase()===r});out.push({ref:m[1],color:m[2],qty:m[3],p:p})}
  if(!S.pasted.trim())return "";
  if(!out.length)return '<p class="muted small">لم أجد منتجات في هذا النص. الصق الرسالة كما وصلتك.</p>';
  return '<div class="grid" style="padding-bottom:0">'+out.map(function(o){return '<div class="card"><div class="ph">'+(o.p?'<img src="'+esc(img(o.p,o.color))+'" alt="">':'<span class="tag">غير موجود</span>')+'</div><div class="body"><div class="info"><span class="ref">'+esc(o.ref)+'</span><b>× '+esc(o.qty)+'</b></div><span class="small">'+(o.p?kindWord(o.p):"اللون")+': '+esc(o.color||"-")+'</span></div></div>'}).join("")+'</div>';
}
function render(){
  var ae=document.activeElement,fid=ae&&ae.id&&app.contains(ae)?ae.id:null,ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}
  app.innerHTML=header()+(S.view==="cart"?cartView():S.view==="admin"&&S.admin?adminView():shopView());galInit();
  if(fid){var ne=document.getElementById(fid);if(ne){try{ne.focus({preventScroll:true});if(ss!=null)ne.setSelectionRange(ss,se)}catch(e){}}}
}
function refreshGrid(){var g=document.getElementById("grid");if(g)g.innerHTML=gridHtml();galInit()}
function refreshSend(){
  var a=document.getElementById("send");if(!a)return;var ready=formOk()&&waPhone();
  a.href=ready?waHref():"#";a.setAttribute("aria-disabled",String(!ready));
  var h=document.getElementById("sendhint");if(h)h.textContent=!waPhone()?"رقم واتساب المتجر غير مضبوط بعد.":(ready?"سيفتح واتساب برسالة جاهزة فيها كل منتجاتك. اضغط إرسال هناك.":"املأ الاسم والهاتف والولاية والعنوان أولاً.");
  var o=document.getElementById("otext");if(o)o.textContent=orderText();
  var t=document.getElementById("tot");if(t)t.textContent=fmt(cartTotal());
  var c=document.getElementById("cc");if(c)c.textContent=cartCount();
}
function markDirty(){if(!S.dirty){S.dirty=true;render()}}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(e.target.closest("#send")){if(!(formOk()&&waPhone())){e.preventDefault();toast(waPhone()?"أكمل معلومات التوصيل أولاً":"رقم واتساب المتجر غير مضبوط")}return}
  if(!b)return;var act=b.dataset.act,id=b.dataset.id;
  var sel=id?(S.sel[id]=S.sel[id]||{qty:1,color:""}):null;
  if(act==="go"){S.view=b.dataset.v;render();window.scrollTo(0,0)}
  else if(act==="sort"){S.sort=b.dataset.v;render()}
  else if(act==="color"){sel.color=sel.color===b.dataset.c?"":b.dataset.c;delete S.need[id];refreshGrid();galInit();if(sel.color)galGo(id,imgIndex(byId(id),sel.color),false)}
  else if(act==="gal"){var g=document.querySelector('[data-gal="'+id+'"]');if(g){var cur=Math.round(g.scrollLeft/g.clientWidth);galGo(id,cur+(+b.dataset.d),true)}}
  else if(act==="vt"){var pv=byId(id);if(pv){pv.vt=b.dataset.v==="model"?"model":"color";if(pv.vt==="model")pv.imgs.forEach(function(m,i){if(!/^\s*\d+\s*$/.test(m.c||""))m.c=String(i+1)});S.dirty=true;render()}}
  else if(act==="irm"){var pp=byId(id);if(pp&&pp.imgs.length>1){pp.imgs.splice(+b.dataset.k,1);pp.img=pp.imgs[0].u;S.dirty=true;render()}}
  else if(act==="merge"){var mn=mergeDups();S.dirty=true;render();toast("جُمع "+mn+" منتج مكرر. راجع ثم احفظ")}
  else if(act==="inc"||act==="dec"){sel.qty=Math.max(1,(sel.qty||1)+(act==="inc"?1:-1));var i=document.getElementById("q-"+id);if(i)i.value=sel.qty}
  else if(act==="add"){var p=byId(id);if(options(p).length&&!sel.color){S.need[id]=true;refreshGrid();galInit();bigAlert("اختر "+kindWord(p)+" أولاً","اضغط على "+(isModel(p)?"رقم الموديل":"اللون")+" الذي تريده تحت الصورة، ثم أضف إلى السلة");var cc=document.querySelector('.chip[data-id="'+id+'"]'),cg=cc&&cc.parentNode;if(cg)cg.scrollIntoView({block:"center",behavior:"smooth"});return}
    var ex=cart.find(function(l){return l.id===id&&l.color===sel.color});if(ex)ex.qty+=sel.qty;else cart.push({id:id,color:sel.color,qty:sel.qty});
    saveCart();S.sel[id]={qty:1,color:""};render();toast("أُضيف "+p.ref+" إلى السلة")}
  else if(act==="linc"||act==="ldec"){var l=cartLines()[b.dataset.i].l;l.qty=Math.max(1,l.qty+(act==="linc"?1:-1));saveCart();render()}
  else if(act==="lrm"){var l2=cartLines()[b.dataset.i].l;cart.splice(cart.indexOf(l2),1);saveCart();render()}
  else if(act==="clear"){cart=[];saveCart();S.view="shop";render();toast("أُفرغت السلة")}
  else if(act==="copy"){var txt=orderText();try{navigator.clipboard.writeText(txt).then(function(){toast("نُسخت الطلبية")},function(){selectText()})}catch(err){selectText()}}
  else if(act==="prm"){data.products=data.products.filter(function(p){return p.id!==id});S.dirty=true;render()}
  else if(act==="rmex"){data.products=data.products.filter(function(p){return !p.example});S.dirty=true;render()}
  else if(act==="save"){save()}
  else if(act==="autoread"){autoRead()}
  else if(act==="reread"){rereadOne(id)}
  else if(act==="fixc"){var n=0;data.products.forEach(function(p){if(!p.example&&p.price>=10000){p.price=Math.round(p.price/100);n++}});S.dirty=true;render();toast("صُحّح "+n+" سعر. راجعها ثم احفظ")}
});
function selectText(){var o=document.getElementById("otext");if(!o)return;var r=document.createRange();r.selectNodeContents(o);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("حدّد النص وانسخه")}
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){S.q=t.value;refreshGrid()}
  else if(t.dataset.qty){var s=S.sel[t.dataset.qty]=S.sel[t.dataset.qty]||{qty:1,color:""};s.qty=Math.max(1,parseInt(t.value,10)||1)}
  else if(t.dataset.line){var v=parseInt(t.value,10);if(v>0){cartLines()[t.dataset.line].l.qty=v;saveCart();refreshSend()}}

  else if(t.dataset.ic){var q=byId(t.dataset.id);if(q&&q.imgs[+t.dataset.ic]){q.imgs[+t.dataset.ic].c=t.value.trim();if(!isModel(q))addColor(q,t.value.trim());S.dirty=true;var sb=document.querySelector(".savebar");if(!sb)render()}}
  else if(t.id==="paste"){S.pasted=t.value;document.getElementById("pasted").innerHTML=pastedHtml()}
});

/* ---------- merchant tools ---------- */
function shrink(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var m=1200,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,m/Math.max(w,h));var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){res(b||file)},"image/jpeg",0.84)};
    im.onerror=function(){URL.revokeObjectURL(url);res(file)};im.src=url;
  });
}
var READ_PROMPT='You are reading a product photo from an Algerian wholesaler of artificial flowers. On each photo the merchant writes labels such as "REF : WR-084", "السعر 85 الف" (the price) and "عدد الورد : 12" (number of flower stems). If several models with their own reference and price appear, list each one. Reply with JSON only, in this shape: {"items":[{"ref":"string","price_text":"string","stems":number,"shown_color":"string","colors":["Arabic color names"]}]}. ref: the code after REF, copied exactly (letters, digits, dashes). price_text: find the word السعر and copy the text that follows it EXACTLY, character by character, including a word such as الف or الاف (for example "85 الف" or "110 الاف"). Never take the price from any other number on the photo: the number after "عدد الورد" is the stem count, not the price. If there is no word السعر, copy the price as written. Do not calculate or convert. stems: the number after "عدد الورد", or 0. shown_color: the main color of the flowers visible in this photo, as one Arabic word such as أحمر or وردي ("" if unclear). colors: only the color options clearly offered for that model, as Arabic words such as أحمر، أبيض، وردي; use [] if unclear. If nothing is readable, return {"items":[]}.';
function parsePrice(t){
  t=String(t==null?"":t).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)});
  var at=t.search(/السعر|سعر/);if(at>-1)t=t.slice(at).replace(/^(السعر|سعر)\s*[:：]?\s*/,"");
  var thousand=/(ألف|الف|آلاف|الاف|ألاف|آلف|\bk\b)/i.test(t);
  var s=t.replace(/(\d)[\s.,  ](?=\d{3}(?!\d))/g,"$1");
  var m=s.match(/\d+(?:[.,]\d+)?/);if(!m)return 0;
  var n=parseFloat(m[0].replace(",","."));if(!(n>0))return 0;
  if(data.shop.unit==="da")return Math.round(thousand?n*1000:n);
  var centimes=thousand||n<1000?n*1000:n;
  return Math.round(centimes/100);
}
function normRef(r){return String(r||"").trim().toLowerCase().replace(/\s+/g,"")}
async function readImage(blob){
  var r=await cap.sample.json(READ_PROMPT,{images:[blob],modelTier:"default"});
  var items=(r&&Array.isArray(r.items))?r.items:(r&&r.ref?[r]:[]);
  return items.map(function(it){var txt=String(it.price_text!=null?it.price_text:(it.price!=null?it.price:"")).trim();return{ref:String(it.ref||"").trim(),raw:txt,price:parsePrice(txt),colors:Array.isArray(it.colors)?it.colors.filter(Boolean).join("، "):"",shown:String(it.shown_color||"").trim(),stems:parseInt(String(it.stems||"").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}),10)||0}}).filter(function(it){return it.ref||it.price});
}
function readErr(err){var c=err&&err.code;if(c==="not_granted"||c==="images_unavailable"){S.canRead=false;return "stop"}if(c==="rate_limited")return "slow";return "skip"}
async function addFiles(list){
  if(!cap.assets){toast("رفع الصور غير متاح هنا");return}
  var files=Array.prototype.slice.call(list||[]).filter(function(f){return /^image\//.test(f.type)||!f.type});
  if(!files.length)return;
  if(data.products.some(function(p){return p.example}))data.products=data.products.filter(function(p){return !p.example});
  var st={added:0,updated:0,review:0,fail:0},next=0,stopped=false;
  S.busy="";S.job={label:S.canRead?"أرفع الصور وأقرأ المرجع والسعر…":"أرفع الصور…",done:0,total:files.length};S.dirty=true;render();
  async function one(file){
    var blob,url;
    try{blob=await shrink(file);url=(await cap.assets.upload(blob)).url}catch(e){st.fail++;return}
    var items=[];
    if(S.canRead&&!stopped){
      for(var tries=0;tries<3;tries++){
        try{items=await readImage(blob);break}
        catch(err){var k=readErr(err);if(k==="stop"){stopped=true;break}if(k==="slow"){await new Promise(function(r){setTimeout(r,8000*(tries+1))});continue}break}
      }
    }
    if(!items.length)items=[{ref:"",price:0,colors:""}];
    items.forEach(function(it){
      var old=it.ref&&data.products.find(function(p){return normRef(p.ref)===normRef(it.ref)});
      if(old){if(it.stems&&!old.stems)old.stems=it.stems;old.imgs=old.imgs||[];old.imgs.push({u:url,c:it.shown});old.img=old.imgs[0].u;if(it.price>0)old.price=it.price;old.raw=it.raw;splitColors(it.colors).forEach(function(c){addColor(old,c)});addColor(old,it.shown);st.updated++}
      else{var id=uid();blobs[id]=blob;var np={id:id,ref:it.ref,price:it.price,raw:it.raw,stems:it.stems||0,img:url,imgs:[{u:url,c:it.shown}],colors:it.colors||(it.shown?"":data.shop.colors),fresh:true};addColor(np,it.shown);data.products.push(np);
        if(it.ref&&it.price>0)st.added++;else st.review++}
    });
  }
  async function worker(){while(next<files.length){var f=files[next++];await one(f);S.job.done++;render()}}
  await Promise.all([worker(),worker(),worker()]);
  S.job=null;
  var parts=[];if(st.added)parts.push("أُضيف "+st.added+" منتج");if(st.updated)parts.push(st.updated+" صورة أُضيفت لموديل موجود بنفس المرجع");if(st.review)parts.push(st.review+" يحتاج أن تكتب مرجعه أو سعره (في أعلى القائمة)");if(st.fail)parts.push("تعذّر رفع "+st.fail+" صورة");
  if(stopped)parts.push("القراءة التلقائية غير مسموحة، أكمل الباقي بيدك");
  S.busy=parts.join(" · ")+". راجع الأسعار بسرعة ثم اضغط «حفظ ونشر».";
  render();
}
async function addPhotosTo(id,list){
  var p=byId(id);if(!p)return;if(!cap.assets){toast("رفع الصور غير متاح هنا");return}
  var files=Array.prototype.slice.call(list||[]);if(!files.length)return;
  S.busy="";S.job={label:"أضيف صوراً إلى "+(p.ref||"المنتج")+"…",done:0,total:files.length};render();
  for(var i=0;i<files.length;i++){
    try{var blob=await shrink(files[i]);var url=(await cap.assets.upload(blob)).url;var lab="";
      if(isModel(p))lab=String(p.imgs.length+1);
      else if(S.canRead){try{var it=(await readImage(blob))[0];if(it&&it.shown)lab=it.shown}catch(e){}}
      p.imgs.push({u:url,c:lab});p.img=p.imgs[0].u;if(lab&&!isModel(p))addColor(p,lab);
    }catch(e){toast("تعذّر رفع صورة")}
    S.job.done++;render();
  }
  S.job=null;S.dirty=true;S.busy="أُضيف "+files.length+" صورة إلى "+(p.ref||"المنتج")+". راجع "+(isModel(p)?"أرقام الموديلات":"الألوان")+" تحت الصور ثم اضغط «حفظ ونشر».";render();
}
async function rereadOne(id){
  var p=byId(id);if(!p||S.job)return;S.job={label:"أعيد قراءة "+(p.ref||"الصورة")+"…",done:0,total:1};render();
  try{var b=blobs[p.id]||await (await fetch(p.img)).blob();var items=await readImage(b);
    var it=items.find(function(x){return p.ref&&normRef(x.ref)===normRef(p.ref)})||items[0];
    if(it){if(!p.ref)p.ref=it.ref;if(it.price>0)p.price=it.price;p.raw=it.raw;S.dirty=true}
    S.busy=it?("قرأت: «"+it.raw+"» ← "+fmt(it.price)):"لم أستطع قراءة السعر من هذه الصورة. اكتبه بيدك.";
  }catch(err){readErr(err);S.busy="تعذّرت القراءة. اكتب السعر بيدك."}
  S.job=null;render();
}
async function autoRead(){
  var todo=data.products.filter(function(p){return !p.example&&(!p.ref||!(p.price>0))});
  if(!todo.length){toast("كل المنتجات مكتملة");return}
  S.busy="";S.job={label:"أعيد قراءة الصور…",done:0,total:todo.length};render();
  for(var i=0;i<todo.length;i++){
    var p=todo[i];
    try{var b=blobs[p.id]||await (await fetch(p.img)).blob();var items=await readImage(b);var it=items[0];
      if(it){if(it.ref&&!p.ref)p.ref=it.ref;if(it.price>0&&!(p.price>0))p.price=it.price;if(it.colors&&!p.colors)p.colors=it.colors}
    }catch(err){var k=readErr(err);if(k==="stop"||k==="slow"){S.job=null;S.busy=k==="stop"?"القراءة التلقائية غير مسموحة. أكمل المرجع والسعر بيدك.":"توقفت القراءة مؤقتاً، أعد المحاولة بعد دقيقة.";render();return}}
    S.job.done++;render();
  }
  S.job=null;S.busy="انتهت القراءة. راجع النتيجة ثم اضغط «حفظ ونشر».";S.dirty=true;render();
}
async function save(){
  S.bad={};data.products.forEach(function(p){if(!p.example&&(!String(p.ref).trim()||!(p.price>0)))S.bad[p.id]=1});
  if(Object.keys(S.bad).length){render();toast("أكمل المرجع والسعر للمنتجات المحددة");return}
  if(S.job){toast("انتظر حتى تنتهي قراءة الصور");return}
  if(!cap.artifact){toast("الحفظ غير متاح هنا");return}
  S.saving=true;render();
  var clean={shop:data.shop,products:data.products.map(function(p){var ims=(p.imgs||[]).filter(function(m){return m&&m.u});var o={id:p.id,ref:String(p.ref).trim(),price:p.price,stems:+p.stems||0,img:ims.length?ims[0].u:p.img,imgs:ims,colors:p.colors};if(isModel(p))o.vt="model";if(p.example)o.example=true;return o})};
  var json=JSON.stringify(clean).replace(/</g,"\\u003c");
  var css=document.getElementById("app-css").textContent,src=document.getElementById("app-src").textContent;
  var html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD_HTML+'<style id="app-css">'+css+'</style><div id="app" dir="rtl" lang="ar"></div><script type="application/json" id="shop-data">'+json+'<\/script><script id="app-src">'+src+'<\/script></body></html>';
  try{sessionStorage.setItem("warda-view","admin")}catch(e){}
  try{await cap.artifact.publish(html);toast("حُفظ المتجر")}
  catch(err){S.saving=false;var c=err&&err.code;
    toast(c==="conflict"?"تغيّرت الصفحة من مكان آخر، سيُعاد تحميلها":c==="not_writer"||c==="not_granted"?"ليس لديك صلاحية الحفظ":c==="too_large"?"الصفحة كبيرة جداً":"تعذّر الحفظ، حاول مرة أخرى");render()}
}

render();

  if(!window.claude||!window.claude.use)return;
  try{
    var u=await window.claude.use("user");var ok=false;
    if(u&&u.canEdit)ok=!!(await u.canEdit());

    var v=null;try{v=sessionStorage.getItem("warda-view");sessionStorage.removeItem("warda-view")}catch(e){}
    if(v==="admin")S.view="admin";
    render();
  }catch(e){}
})();
})();
